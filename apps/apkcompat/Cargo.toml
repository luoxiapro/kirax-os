[package]
name = "apkcompat"
version = "0.1.0"
edition = "2021"
description = "Space OS APK 兼容层（参考鸿蒙卓易通）：APK(ZIP) 解析 + AndroidManifest 二进制 XML 解析"

[lib]
name = "apkcompat"
path = "src/lib.rs"
# staticlib：可被链接器提取 .text 作为 .kir 代码段
crate-type = ["rlib", "staticlib"]

# 无第三方依赖；no_std + alloc 设计：
#   - 主机 `cargo test`：直接运行单测（alloc 由 std 提供）
#   - 真机 .kir 编译：thumbv7a-none-eabi（alloc 由 Space OS 运行时提供）
#   - feature `kir-standalone`：独立打包时提供最小 allocator + panic handler
[dependencies]

[features]
kir-standalone = []

[profile.release]
opt-level = 3
