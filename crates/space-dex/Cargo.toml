[package]
name = "space-dex"
version = "0.1.0"
edition = "2021"
description = "Space OS DEX 解析器与字节码解释器（APK 兼容层核心引擎，no_std + host 可测）"

[lib]
# 纯 rlib：作为 apkcompat 的依赖并入其 staticlib（.kir 打包对象）。
# 不设 staticlib crate-type，避免 host 预编译时要求 allocator/panic_handler
# （thumbv7a 依赖构建时无 std 也能编）。
crate-type = ["rlib"]

[dependencies]

[features]
default = []
# 独立打包时提供最小 allocator + panic handler（与 apkcompat kir-standalone 语义一致）
kir-standalone = []

[profile.release]
opt-level = 3
panic = "abort"
